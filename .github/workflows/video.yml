name: Generar vídeo

on:
  workflow_dispatch:
    inputs:
      proyecto:
        description: "Carpeta dentro de proyectos/ con su storyboard.json"
        default: "bolsa-per"

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar FFmpeg (lo necesita HyperFrames)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de voz y subtítulos
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Caché de los modelos (voz y Whisper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-tts-whisper-small-v1

      - name: Caché de frases de voz (el cierre se repite en todos los vídeos)
        uses: actions/cache@v4
        with:
          path: voz_cache
          key: voz-cache-v1-${{ github.run_id }}
          restore-keys: voz-cache-v1-

      - name: Pruebas
        run: |
          python test_formatos.py
          python tests/test_caja.py
          python tests/test_voz.py
          python tests/test_reintento_voz.py
          python tests/test_escenas3d.py
          python tests/test_gancho.py
          python tests/test_cobertura_numeros.py

      - name: Generar el vídeo (voz D, subtítulos, montaje y render)
        run: |
          t0=$(date +%s)
          python caja/pipeline.py proyectos/${{ inputs.proyecto }}
          echo "Tiempo total del vídeo: $(( $(date +%s) - t0 )) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.proyecto }}
          path: proyectos/${{ inputs.proyecto }}/renders/*.mp4
          retention-days: 7
